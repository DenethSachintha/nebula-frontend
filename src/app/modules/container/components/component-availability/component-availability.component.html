<header class="header-outer">
  <div class="logo-container">
    <img src="assets/img/nebula-logo.png" alt="Logo" class="logo">
    <h1 class="nebula">nEBULA</h1>
  </div>
  <div class="container">
    <div class="search-container">
      <input type="text" id="nameInput" [(ngModel)]="searchTerm" class="search-box" placeholder="Search your item...">
      <button type="submit"  (click)="searchComponentByName()" class="search-button">Search</button>
    </div>
    <nav class="nav">
      <ul>
        <li><button routerLink="/starter/home">Home</button></li>
        <li><button routerLink="/container/detail/{{currentComponentID}}" routerLinkActive="active">Details</button></li>
        <li><button routerLink="/container/availability/{{currentComponentID}}" routerLinkActive="active">Availability</button></li>
      </ul>
    </nav>
  </div>
</header>

  <div class="search-results-wrapper">
  <div class="search-results-container" *ngIf="searchResults.length > 0">
    <h4 class="search-results-header">Search Results:</h4>
    <div class="search-results-ul" *ngFor="let component of searchResults">
      <a class="search-results-button" href="/container/availability/{{component._id}}">{{ component.componentName }}</a>
    </div>
  </div>
</div>

<div class="com-div" *ngIf="componentData" >
  <h3 class="com-name">{{ componentData.componentName }}</h3>
  <img class="com-image" src="{{componentData.componentImage}}" alt="Component Image">
</div>
<div class="stores-wrapper">
  <div class="stores-component">
    <div class="store-container"  *ngIf="stores">
      <div *ngFor="let store of stores" class="" >
        <button class="Store-btn"  type="button"  (click)="getStoreByNumber(store.storeNumber)">{{store.storeName}}</button>
      </div>
    </div>
    <div class="store-detail-wrapper">
      <div class="store-detail" *ngIf="storeData">
        <h3 class="store-name">{{  storeData.storeName}}</h3>
        <img class="store-image"  src="{{storeData.storeImage}}"  alt="Store Image"/>
        <div style="margin: 10px">
          <div class="store-flex">
            <p class="store-url">Location:</p>
            <a href="{{storeData.storeLocation}}" style=" font-size: 14px; padding-left: 5px;">{{  storeData.storeDescription}}</a>
          </div>
          <div class="store-flex" >
            <p class="store-phone">Contact Number:</p>
            <p style="font-size: 14px;  color: #114c4c;  padding: 5px;">{{storeData.storePhone}}</p>
          </div>
          <div class="store-flex">
            <p class="store-url">Official Website:</p>
            <a style=" font-size: 14px; padding-left: 5px;" href="{{storeData.storeURL}}">Visit {{  storeData.storeName}}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
